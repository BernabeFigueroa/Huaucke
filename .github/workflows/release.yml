name: Compilar y Publicar Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'Tag de la versión (ej. v1.0.1)'
        required: true
        default: 'v1.0.1'

jobs:
  build-and-release:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Compilar ejecutable (Onefile)
        run: |
          python -m PyInstaller --noconfirm --onefile --windowed --icon="logo.ico" --name="Huaucke" --add-data="logo.jpg;." main.py

      - name: Determinar Tag de Release
        id: vars
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "TAG_NAME=${{ github.event.inputs.version_tag }}" >> $GITHUB_ENV
          else
            echo "TAG_NAME=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV
          fi

      - name: Crear GitHub Release y subir ejecutable
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: Release ${{ env.TAG_NAME }}
          body: |
            Novedades y mejoras en ${{ env.TAG_NAME }}:
            - Modificación de precio en Punto de Venta: posibilidad de aplicar el nuevo precio únicamente a la venta actual o actualizarlo de forma permanente en el catálogo (Base de Datos).
            - Anulación de ventas en Reportes: opción para anular ventas ya registradas con reincorporación automática del stock de los artículos y recálculo de totales de facturación y caja.
            - Mejoras en la grilla del carrito: distribución proporcional de columnas, alineación de valores numéricos y optimización del panel de cobro.
          files: |
            dist/Huaucke.exe
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
